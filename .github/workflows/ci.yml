name: PCPT v3.0 scientific-computation CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Check syntax and test
        run: |
          python -m compileall -q pcpt grm_benchmark.py
          python -m pytest -q
      - name: Run fast synthetic reference
        run: |
          python -m pcpt.cli model --scenario configs/baseline.json --out outputs/model.json
