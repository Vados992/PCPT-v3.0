[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcpt-research"
version = "3.0.0"
description = "Falsification-first PCPT v3.0 GRM computational and field-data research system"
requires-python = ">=3.10"
authors = [{name = "Vadym Tsinderhoz"}]
readme = "README.md"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "matplotlib>=3.7,<4", "pandas>=2.0,<3"]

[project.optional-dependencies]
ui = ["streamlit>=1.35,<2"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[project.scripts]
pcpt = "pcpt.cli:main"

[tool.setuptools]
packages = ["pcpt"]
py-modules = ["grm_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

